name: Amazon Appstore build + emulator test
# Amazon Appstore (Fire) build of this app: same code, built with -Pstore=amazon (no Google Play
# links, no Play in-app review prompt). Run on a tablet-size emulator without Google Play
# services (like Fire). Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [amazon]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: amazon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
    - name: google-services.json (secret) and a CI-only signing key
      env:
        GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GSJ" ]; then
          if printf '%s' "$GSJ" | head -c 1 | grep -q '{'; then printf '%s' "$GSJ" > app/google-services.json; else printf '%s' "$GSJ" | base64 -d > app/google-services.json; fi
        else
          echo '{"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.charles.bible"}},"oauth_client":[],"api_key":[{"current_key":"ci-placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
        fi
        # No release keystore secret exists in this repo: sign the test build with a throwaway CI key
        # (Amazon re-signs submitted apps by default).
        keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/ci.p12" -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass cipass1234 -keypass cipass1234 -dname "CN=CI test key" >/dev/null
        echo "RELEASE_STORE_FILE=$RUNNER_TEMP/ci.p12" >> $GITHUB_ENV
    - name: Build amazon APK (store=amazon)
      env:
        RELEASE_STORE_PASSWORD: cipass1234
        RELEASE_KEY_ALIAS: ci
        RELEASE_KEY_PASSWORD: cipass1234
      run: |
        set -o pipefail
        chmod +x gradlew; ./gradlew --stacktrace --no-daemon :app:assembleRelease -Pstore=amazon 2>&1 | tee -a /tmp/amz-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p amz-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" amz-apk/ScriptureSearch-amazon-release.apk
        ls -la amz-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs amz-apk/ScriptureSearch-amazon-release.apk | head -3 || true
        $BT/aapt2 dump badging amz-apk/ScriptureSearch-amazon-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the amazon release dex:"; unzip -p amz-apk/ScriptureSearch-amazon-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/amz-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/amzlog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (no Google Play services, like Fire)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: default
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/amazon/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        # the tested release APK rides along so it can be staged for the Appstore upload (Tab, Nov 9 2026)
        mkdir -p /tmp/amz-out && cp amz-apk/*release*.apk /tmp/amz-out/ 2>/dev/null || true
        bash .github/amazon/amazon-upload.sh /tmp/amz-out amz_ScriptureSearch_r${{ github.run_number }}
    - name: Draft release with the amazon APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: amazon-${{ github.run_number }}
        name: Amazon build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: amz-apk/ScriptureSearch-amazon-release.apk
