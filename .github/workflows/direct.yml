name: Direct download build + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with store=direct
# (no Google Play links, no Play in-app review prompt, nothing sold through Google Play). Emulator with Google APIs (a normal phone).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
    - name: google-services.json (secret) and the signing key
      env:
        GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        KS_KPW: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$GSJ" ]; then
          if printf '%s' "$GSJ" | head -c 1 | grep -q '{'; then printf '%s' "$GSJ" > app/google-services.json; else printf '%s' "$GSJ" | base64 -d > app/google-services.json; fi
        else
          echo '{"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.charles.bible"}},"oauth_client":[],"api_key":[{"current_key":"ci-placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
        fi
        # Release keystore: the repo secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD when set
        # (the real release key); without them the test build is signed with a throwaway CI key, which is NOT for a public release.
        if [ -n "$KS_B64" ]; then
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.p12" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=$KS_PW" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=$KS_KPW" >> $GITHUB_ENV
          echo "signing: release keystore secret"
        else
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/ci.p12" -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass cipass1234 -keypass cipass1234 -dname "CN=CI test key" >/dev/null
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/ci.p12" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=cipass1234" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=ci" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=cipass1234" >> $GITHUB_ENV
          echo "signing: THROWAWAY CI key (no KEYSTORE_BASE64 secret) - not for public release"
        fi
    - name: Build direct APK (store=direct)
      run: |
        set -o pipefail
        chmod +x gradlew; ./gradlew --stacktrace --no-daemon :app:assembleRelease -Pstore=direct 2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" dsk-apk/ScriptureSearch-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/ScriptureSearch-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/ScriptureSearch-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/ScriptureSearch-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (Google APIs image, like a normal phone)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: Nexus 7 2013
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_ScriptureSearch_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/ScriptureSearch-direct-release.apk
